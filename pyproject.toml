[project]
name = "divyam-llm-interop"
version = "0.2.0"
description = "A lightweight, provider-neutral library for translating LLM requests and responses across model APIs."
authors = [{ name = "DivyamAI Technologies Private Limited" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0.3",
    "typing-extensions>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/Divyam-AI/divyam-llm-interop"
Source = "https://github.com/Divyam-AI/divyam-llm-interop"
Issues = "https://github.com/Divyam-AI/divyam-llm-interop/issues"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/divyam_llm_interop"]

[tool.hatch.build.targets.sdist]
include = ["src/**"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.27.0",
]
lint = [
    "ruff>=0.15.1",
    "pyright>=1.1.408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live API integration tests (require API keys, use: pytest -m integration)",
]

[tool.ruff.lint]
ignore = [
    "UP007", # prefer Optional[X] over X | None
    "UP045", # prefer Optional[X] over X | None
]
