# hosted_tools lists the built-in tools a model runs on Google's servers, as
# its model page states them: Google Search grounding as web_search, URL
# context as web_fetch. A kind the docs do not confirm is left out; see
# provider_hosted_tools.
- selector:
    name:
      regex: gemini.*
  capabilities:
    description: Force strict completions compatibility for all gemini models
    strict_completions_compatibility: true
    supports_google_extra_body: true
    supported_api_types:
      - completions
      - gemini

# ────────────────────────────────────────────────────────
# Gemini 4
# ────────────────────────────────────────────────────────

# Thinking cannot be turned off. The 1M context window is shared by input
# and output; synchronous output stops at 65,536 tokens.
- selector:
    name: gemini-4-argon
  capabilities:
    hosted_tools: [ "web_search", "web_fetch", "code_execution", "file_search" ]
    max_tokens: { min: 1, max: 65536 }
    input_token_limit: 1048576
    supports_function_calling: true
    supports_vision: true
    supports_reasoning: true
    reasoning_enabled_by_default: true
    reasoning_can_be_disabled: false

# ────────────────────────────────────────────────────────
# Gemini 3.8 / 3.7
# ────────────────────────────────────────────────────────

- selector:
    name:
      regex:
        - gemini-3\.[78]-flash
  capabilities:
    hosted_tools: [ "web_search", "web_fetch", "code_execution", "file_search" ]
    max_tokens: { min: 1, max: 65536 }
    input_token_limit: 1048576
    supports_function_calling: true
    supports_vision: true
    supports_reasoning: true
    reasoning_enabled_by_default: true

# ────────────────────────────────────────────────────────
# Gemini 3.6
# ────────────────────────────────────────────────────────

- selector:
    name: gemini-3.6-flash
  capabilities:
    hosted_tools: [ "web_search", "web_fetch", "code_execution", "file_search" ]
    max_tokens: { min: 1, max: 65536 }
    input_token_limit: 1048576
    temperature: { min: 0.0, max: 2.0 }
    top_k: { min: 1, max: 100 }
    top_p: { min: 0.0, max: 1.0 }
    frequency_penalty: { min: -2.0, max: 2.0 }
    presence_penalty: { min: -2.0, max: 2.0 }
    candidate_count: { min: 1, max: 8 }
    supports_stop_sequences: true
    stop_sequences:
      max_count: 5
      max_length_each: 20
    supports_reasoning: true
    supports_google_thinking_config: true
    api_capabilities:
      completions:
        drop_fields:
          - frequency_penalty
          - presence_penalty

