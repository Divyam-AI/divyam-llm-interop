# Gemini 4 and 3 return a 400 when a function call in the current turn comes
# back without its thought signature. Gemini 3 Pro Image does not enforce it.
- selector:
    name:
      regex:
        - gemini-3.*
        - gemini-4.*
  capabilities:
    tool_loop_requires_reasoning_replay: true

- selector:
    name: gemini-3-pro-image-preview
  capabilities:
    tool_loop_requires_reasoning_replay: false
