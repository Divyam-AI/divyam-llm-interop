name: Release

# A release is a commit on main that names the version, a tag on that commit,
# and a build of that commit published to PyPI.
#
# Run the workflow from main (workflow_dispatch): it decides the version, runs
# CI, commits the bump to pyproject.toml and uv.lock, tags that commit, then
# builds and publishes the tagged commit. Pushing a vX.Y.Z tag yourself
# releases that tag instead, provided it is on main and pyproject.toml there
# names the version.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. 0.4.0). Empty: main's version if unpublished,
          else the next patch.
        required: false
        type: string
        default: ""
      test-pypi:
        description: "Publish to TestPyPI only: main is not bumped, nothing is tagged"
        required: false
        type: boolean
        default: false

# Releases run one at a time: two would race for main and for the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Guard: decide the version, refuse before anything runs ────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      normalized: ${{ steps.version.outputs.normalized }}
      tag: ${{ steps.version.outputs.tag }}
      # The tag already exists for an unpublished version: an earlier run
      # tagged it and failed before publishing. This run releases that tag.
      resume: ${{ steps.version.outputs.resume }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Decide and check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
          TEST_PYPI: ${{ inputs.test-pypi }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          pyproject_version() {
            git show "$1:pyproject.toml" | sed -nE 's/^version = "(.*)"/\1/p'
          }
          git fetch --quiet origin main

          if [ "$EVENT" = "push" ]; then
            REQUESTED="${GITHUB_REF#refs/tags/v}"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || fail "Tag v$REQUESTED is not on main"
            [ "$(pyproject_version "$GITHUB_SHA")" = "$REQUESTED" ] \
              || fail "pyproject.toml at v$REQUESTED names $(pyproject_version "$GITHUB_SHA")"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            fail "Run the release from main, not ${GITHUB_REF#refs/heads/}"
          fi

          INDEX=https://pypi.org
          [ "$TEST_PYPI" = "true" ] && INDEX=https://test.pypi.org
          RESULT="$(uv run --no-project --with packaging python \
            .github/scripts/release_version.py \
            --package divyam-llm-interop --index "$INDEX" \
            --current "$(pyproject_version origin/main)" \
            --requested "$REQUESTED")"
          VERSION="$(echo "$RESULT" | sed -n 's/^version=//p')"
          TAG="v$VERSION"

          RESUME=false
          REF="$GITHUB_SHA"
          if [ "$EVENT" = "push" ]; then
            REF="$TAG"
          elif [ "$TEST_PYPI" != "true" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            git merge-base --is-ancestor "$TAG^{commit}" origin/main \
              || fail "Tag $TAG exists but is not on main"
            [ "$(pyproject_version "$TAG")" = "$VERSION" ] \
              || fail "Tag $TAG exists but its pyproject.toml names $(pyproject_version "$TAG")"
            echo "::notice::$TAG exists and $VERSION is unpublished: releasing the tag"
            RESUME=true
            REF="$TAG"
          fi

          echo "$RESULT" >> "$GITHUB_OUTPUT"
          {
            echo "tag=$TAG"
            echo "resume=$RESUME"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"
          echo "📦 Releasing $VERSION ($TAG) from $REF"

  # ── Gate: full CI before anything is pushed or published ───────
  test:
    needs: prepare
    uses: ./.github/workflows/test.yml

  lint:
    needs: prepare
    uses: ./.github/workflows/lint.yml

  # ── Release ────────────────────────────────────────────────────
  release:
    environment: pypi
    runs-on: ubuntu-latest
    needs: [prepare, test, lint]
    permissions:
      id-token: write      # PyPI trusted publishing
      contents: write      # push the bump and the tag; create the GitHub release
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NORMALIZED: ${{ needs.prepare.outputs.normalized }}
      TAG: ${{ needs.prepare.outputs.tag }}
      # Commit and tag on main: a dispatched PyPI release that is not
      # resuming an existing tag.
      BUMP: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.resume != 'true' && !inputs.test-pypi }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      # ── Version the source ─────────────────────────────────────
      - name: Set the version in pyproject.toml and uv.lock
        if: env.BUMP == 'true' || inputs.test-pypi
        run: |
          set -euo pipefail
          sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          uv lock
          UNEXPECTED="$(git diff --name-only | grep -vxE 'pyproject.toml|uv.lock' || true)"
          [ -z "$UNEXPECTED" ] \
            || { echo "::error::The version bump also changed: $UNEXPECTED"; exit 1; }

      # The commit (when the version or lock changed) and the tag on it are
      # pushed atomically, so both land or neither. The push is refused if
      # main moved since this run began, before anything is published: rerun
      # the workflow to release from the new main.
      - name: Commit the bump to main and tag it
        if: env.BUMP == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore: release ${TAG} [skip ci]"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$TAG"

      # ── Build ──────────────────────────────────────────────────
      - name: Build distribution
        run: uv build

      - name: Validate distributions
        run: |
          set -euo pipefail
          uvx twine check dist/*
          ls "dist/divyam_llm_interop-${NORMALIZED}-py3-none-any.whl" \
            "dist/divyam_llm_interop-${NORMALIZED}.tar.gz" \
            || { echo "::error::Built distributions are not version ${NORMALIZED}"; exit 1; }

      # ── Publish ────────────────────────────────────────────────
      - name: Publish to PyPI
        if: ${{ !inputs.test-pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

      - name: Publish to TestPyPI
        if: ${{ inputs.test-pypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      # ── GitHub Release: the only step after publishing ─────────
      - name: Create GitHub Release
        if: ${{ !inputs.test-pypi }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
