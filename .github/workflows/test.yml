name: Test

on:
  workflow_call:
    inputs:
      upload-coverage:
        description: "Upload coverage to Codecov"
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        exclude:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Force UTF-8 (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "PYTHONUTF8=1" >> $env:GITHUB_ENV
          echo "PYTHONIOENCODING=utf-8" >> $env:GITHUB_ENV
        shell: powershell

      - name: Load integration env
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          echo "${{ secrets.INTEROP_INTEGRATION_TEST_ENV }}" >> $GITHUB_ENV
        shell: bash

      - name: Run tests
        run: |
          if [[ -n "$GEMINI_API_KEY" ]]; then
            ./scripts/test.sh --coverage --all
          else
            ./scripts/test.sh --coverage
          fi
        shell: bash

      - name: Upload coverage to Codecov
        if: inputs.upload-coverage && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./reports/coverage.xml
          fail_ci_if_error: false
